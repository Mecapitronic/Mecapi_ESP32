; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = Mecapitronic-Esp32
description = Firmware for Esp32
default_envs = Esp32_freertos

[env]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
upload_protocol = esptool
build_type = debug
upload_speed = 921600
monitor_filters =
  colorize
  time
  send_on_enter
  esp32_exception_decoder
build_src_filter = 
  +<*>
	-<.git/>
	-<.svn/>
	-<simulator/>
	-<visualizer/>
	-<wiki/>
	-<**/*.jpeg>
	-<**/*.txt>
	-<*.jpeg>
	-<*.txt>

[common]
monitor_speed = 921600
upload_port = 192.168.137.111

[env:Esp32_freertos]

[env:Esp32_LD06]
monitor_speed = ${common.monitor_speed}
build_flags =
	-D LD06
	-D WITH_WIFI
	-D WITH_OTA

[env:Esp32_A010]
monitor_speed = ${common.monitor_speed}
build_flags =
	-D A010

[env:Esp32_VL53]
monitor_speed = 115200
build_flags = -D VL53
lib_deps = sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3

[env:Esp32_All]
monitor_speed = ${common.monitor_speed}
build_flags = 
	-D A010
	-D LD06
	-D VL53
	-D WITH_WIFI
lib_deps = 
	sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3
